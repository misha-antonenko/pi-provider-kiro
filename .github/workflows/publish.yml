name: Publish

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      # Trusted publishing (OIDC) needs npm >= 11.5.1; node 24 ships an older npm.
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run check
      - run: npm test
      - run: npm publish --provenance --access public
